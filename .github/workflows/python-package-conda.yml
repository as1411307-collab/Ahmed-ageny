name: Python tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              deps = tomllib.load(handle)['project']['dependencies']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pytest', *deps])
          PY
      - name: Syntax check
        run: python -m compileall -q .
      - name: Test
        run: pytest -q
