name: Apply acceleration integration

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'apply acceleration integration patch trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic integration patch
        run: python scripts/apply_acceleration_integration.py
      - name: Verify syntax of patched modules
        run: python -m compileall -q acceleration_cache.py n8n_adapter.py skill_tools.py policy.py agent_core.py server.py
      - name: Commit patched integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill_tools.py policy.py agent_core.py server.py pyproject.toml
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "feat: wire Redis acceleration and approval-gated n8n"
          git push origin HEAD:${{ github.ref_name }}
